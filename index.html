<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andreas Stehmann – Andreas Stehmann</title>
    <meta name="description" content="Dein Shop – alle Kategorien auf einen Blick">
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:880px;margin:0 auto;padding:20px;background:#ffffff;color:#1d1d1f;line-height:1.5;}
        a {color:#0071e3;text-decoration:none;}
        a:hover {text-decoration:underline;}
        h1 {font-size:28px;font-weight:600;margin-bottom:2px;}
        .sub {color:#86868b;font-size:13px;margin-bottom:20px;}
        .product {display:flex;gap:12px;border:1px solid #e8e8ed;border-radius:8px;padding:10px;margin-bottom:8px;background:#fff;align-items:flex-start;}
        .product img {width:90px;height:90px;object-fit:contain;flex-shrink:0;background:#f5f5f7;border-radius:6px;}
        .info {flex:1;}
        .name {font-weight:600;font-size:14px;}
        .desc {color:#86868b;font-size:12px;margin-bottom:4px;line-height:1.4;}
        .price {color:#0071e3;font-weight:500;font-size:12px;margin-bottom:6px;}
        .btn {display:inline-block;padding:5px 10px;background:#0071e3;border-radius:4px;color:#fff;font-size:11px;font-weight:500;}
        .btn:hover {background:#0077ed;text-decoration:none;}
        .back {display:block;text-align:center;margin-top:18px;color:#0071e3;font-size:13px;}
        .back:hover {text-decoration:underline;}
        footer {margin-top:18px;text-align:center;font-size:11px;color:#aeaeb2;border-top:1px solid #eaeaea;padding-top:12px;}
        @media (max-width:480px) {
            .product {flex-direction:column;}
            .product img {width:100%;height:auto;margin-bottom:8px;}
        }
    </style>
</head>
<body>
    <h1>Andreas Stehmann</h1>
    <p class="sub">Dein Shop – alle Kategorien auf einen Blick</p>
    <div style="margin:10px 0;">

    </div>
    <a href="/andreasstehmann-links/" class="back">Zur Startseite →</a>
    <footer>
        <p>© 2026 – Affiliate-Links zu Amazon.</p>
    </footer>
</body>
</html>
