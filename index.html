    <style>
        /* RESET */
        *, *::before, *::after {box-sizing: border-box; margin: 0; padding: 0;}
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            scroll-behavior: smooth;
        }
        
        /* CONTAINER */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* STICKY HEADER */
        .sticky-header {
            position: sticky;
            top: 0;
            background: #ffffff;
            border-bottom: 1px solid #e8e8ed;
            padding: 16px 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.3px;
        }
        
        .logo-sub {
            font-size: 12px;
            color: #86868b;
            margin-top: 2px;
        }
        
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .nav-link {
            display: inline-block;
            padding: 8px 12px;
            background: #f5f5f7;
            border-radius: 8px;
            font-size: 13px;
            color: #1d1d1f;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.15s ease;
        }
        
        .nav-link:hover {
            background: #e8e8ed;
        }
        
        .nav-link:active {
            background: #d2d2d7;
        }
        
        /* HERO */
        .hero {
            text-align: center;
            padding: 40px 0 30px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 30px;
        }
        
        .hero h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        
        .hero p {
            font-size: 14px;
            color: #86868b;
            max-width: 500px;
            margin: 0 auto;
        }
        
        /* NISSCHEN ABSCHNITTE */
        .niche-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .niche-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        
        .niche-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .niche-icon {
            width: 36px;
            height: 36px;
            background: #f5f5f7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .niche-icon svg {
            width: 18px;
            height: 18px;
            color: #86868b;
        }
        
        .niche-name {
            font-size: 18px;
            font-weight: 600;
            color: #1d1d1f;
        }
        
        .niche-count {
            font-size: 13px;
            color: #86868b;
            background: #f5f5f7;
            padding: 4px 8px;
            border-radius: 8px;
        }
        
        .niche-desc {
            font-size: 13px;
            color: #86868b;
            margin-bottom: 16px;
        }
        
        /* PRODUKT GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        
        .product-card {
            background: #fafafa;
            border: 1px solid #e8e8ed;
            border-radius: 10px;
            padding: 12px;
            text-decoration: none;
            color: inherit;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
            display: block;
        }
        
        .product-card:hover {
            background: #f0f0f0;
            border-color: #d2d2d7;
            transform: translateY(-2px);
        }
        
        .product-image {
            width: 100%;
            aspect-ratio: 1/1;
            background: #f5f5f7;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .product-name {
            font-size: 13px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 2px;
            line-height: 1.3;
        }
        
        .product-desc {
            font-size: 11px;
            color: #86868b;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        
        .product-price {
            font-size: 13px;
            font-weight: 500;
            color: #0071e3;
            margin-bottom: 8px;
        }
        
        .product-link {
            display: inline-block;
            padding: 6px 0;
            background: #0071e3;
            color: white;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.15s ease;
        }
        
        .product-link:hover {
            background: #0077ed;
        }
        
        .product-link:active {
            background: #0067cc;
        }
        
        /* FOOTER */
        footer {
            text-align: center;
            padding: 30px 0 20px;
            font-size: 12px;
            color: #86868b;
            border-top: 1px solid #f0f0f0;
            margin-top: 30px;
        }
        
        footer a {
            color: #0071e3;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        .disclaimer {
            font-size: 11px;
            color: #aeaeb2;
            margin-top: 8px;
            line-height: 1.4;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 {font-size: 24px;}
            .product-grid {grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));}
            .nav-links {gap: 4px;}
            .nav-link {padding: 6px 10px; font-size: 12px;}
        }
        
        @media (max-width: 480px) {
            .product-grid {grid-template-columns: 1fr; max-width: 360px; margin: 0 auto;}
            .sticky-header {position: relative;}
        }
    </style>
</head>
